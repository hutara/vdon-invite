<head>
	<title>RemoteVm invite link generator</title>
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<meta charset="utf-8" />
	<script src="thirdparty/randomName.js"></script>
	<script src="thirdparty/aes.js"></script>
	<script src="thirdparty/qrjs2.js"></script>
	<script src="main.js?v=3"></script>
	<link rel="icon" type="image/png" href="favicon.png">
	<link rel="stylesheet" href="style.css?v=2" />
	<link rel="stylesheet"
		href="https://maxst.icons8.com/vue-static/landings/line-awesome/line-awesome/1.3.0/css/line-awesome.min.css">
</head>

<body>
	<h1>
		<a href="https://live.remotevm.ir">Remote Vm</a> invite Link generator
		<small>R.V.M قابلیت‌های بیشتر <a
				href="https://about.remotevm.ir">Advanced Settings</a>
			RemoteVm.ir</small>
	</h1>
	<div id="panels">

	</div>
	<div id="links">
		<div id="guestLink">
			<h4>Guest invite Link <span onclick="guestQRCode('#url')">QR Code</span></h4>
			
			<div class="switchGroup obfuscateSwitch">
				<label class="switch">
					<input id="guestBetaToggle" type="checkbox" name="beta" onchange="toggleBeta()"></input>
					<span class="slider round"></span>
				</label>
				<span>Beta</span>
			</div>
			<a id="url" title="Click to copy" class="url" data-raw="https://live.remotevm.ir/" href="https://live.remotevm.ir/"
				onclick="popupMessage(event);copyFunction(this)" onmousedown="copyFunction(this)"></a>
		</div>
		<div id="viewLink">
			<h4>Viewer (OBS) Link <span onclick="guestQRCode('#viewUrl')">QR Code</span></h4>
			<div class="switchGroup obfuscateSwitch">
				<label class="switch">
					<input id="viewerBetaToggle" type="checkbox" name="beta" onchange="toggleBeta('viewUrl')"></input>
					<span class="slider round"></span>
				</label>
				<span>Beta</span>
			</div>
			<a id="viewUrl" title="Click to copy" class="url" data-raw="https://live.remotevm.ir/" href="https://live.remotevm.ir/"
				onclick="popupMessage(event);copyFunction(this)" onmousedown="copyFunction(this)"></a>
		</div>
		<div id="directorLink">
			<h4>Director Link</h4>
			<a id="directorUrl" title="Click to copy" class="url" data-raw="https://live.remotevm.ir/" data-obfuscated="false"
				href="https://live.remotevm.ir/" onclick="popupMessage(event);copyFunction(this)"
				onmousedown="copyFunction(this)">https://live.remotevm.ir/</a>
		</div>
	</div>
	<div id="popup" onclick="this.style.left='-10000px'; this.style.top='-1000px'">
		<span id="popupDescription"></span>
	</div>
	<div id="messagePopup" class="popup-message"></div>


</body>
